cases:
- id: WATCH-REAL-001
  description: Current supported Watchlist lifecycle through real external boundaries
  tags:
  - watchlist
  - integration
  - real
  profile: real_watchlist
  modes:
  - live
  allowed_external: true
  turns:
  - user_query: 查询 DMF ${dmf_no}
  - user_query: 关注刚才的结果
  - user_query: 查看团队关注清单
  - user_query: 立即检查 DMF ${dmf_no}
  - user_query: 查看 DMF ${dmf_no} 的事件
  - user_query: 确认事件 ${event_id}
  - user_query: 取消关注 DMF ${dmf_no}
- id: WATCH-001
  description: All supported single-item Watchlist actions use one real Agent node
  tags:
  - watchlist
  - write
  - read
  fixtures:
    add_result:
      kind: watchlist_result
      value:
        id: watch-1
        dmf_no: DMF-001
        status: active
        interval_hours: 24
        next_run_at: null
    list_result:
      kind: watchlist_result
      value:
      - id: watch-1
        dmf_no: DMF-001
        status: active
        interval_hours: 24
        next_run_at: null
    run_result:
      kind: watchlist_result
      value:
        status: no_change
        error_message: null
        warnings: []
    events_result:
      kind: watchlist_result
      value:
        watchlist:
          id: watch-1
          dmf_no: DMF-001
          status: active
        events:
        - id: event-1
          event_type: valid_date_expired
          status: unread
          created_at: '2026-09-04T00:00:00Z'
    ack_result:
      kind: watchlist_result
      value:
        id: event-1
        status: acknowledged
    remove_result:
      kind: watchlist_result
      value:
        id: watch-1
        dmf_no: DMF-001
        status: active
    react_0_0:
      kind: llm
      value:
        tool_calls:
        - name: run_watchlist_workflow
          args: {}
          id: WATCH-001-0-0
          type: tool_call
    react_0_1:
      kind: llm
      value:
        watchlist_action: add
        dmf_no: DMF-001
    react_0_2:
      kind: llm
      value:
        answer_from: tool
    react_1_0:
      kind: llm
      value:
        tool_calls:
        - name: run_watchlist_workflow
          args: {}
          id: WATCH-001-1-0
          type: tool_call
    react_1_1:
      kind: llm
      value:
        watchlist_action: list
    react_1_2:
      kind: llm
      value:
        answer_from: tool
    react_2_0:
      kind: llm
      value:
        tool_calls:
        - name: run_watchlist_workflow
          args: {}
          id: WATCH-001-2-0
          type: tool_call
    react_2_1:
      kind: llm
      value:
        watchlist_action: run
        watchlist_id: watch-1
    react_2_2:
      kind: llm
      value:
        answer_from: tool
    react_3_0:
      kind: llm
      value:
        tool_calls:
        - name: run_watchlist_workflow
          args: {}
          id: WATCH-001-3-0
          type: tool_call
    react_3_1:
      kind: llm
      value:
        watchlist_action: events
        watchlist_id: watch-1
    react_3_2:
      kind: llm
      value:
        answer_from: tool
    react_4_0:
      kind: llm
      value:
        tool_calls:
        - name: run_watchlist_workflow
          args: {}
          id: WATCH-001-4-0
          type: tool_call
    react_4_1:
      kind: llm
      value:
        watchlist_action: ack
        watchlist_id: watch-1
        watchlist_event_id: event-1
    react_4_2:
      kind: llm
      value:
        answer_from: tool
    react_5_0:
      kind: llm
      value:
        tool_calls:
        - name: run_watchlist_workflow
          args: {}
          id: WATCH-001-5-0
          type: tool_call
    react_5_1:
      kind: llm
      value:
        watchlist_action: remove
        watchlist_id: watch-1
    react_5_2:
      kind: llm
      value:
        answer_from: tool
  turns:
  - user_query: 关注 DMF-001
    scripted_llm:
    - react_0_0
    - react_0_1
    - react_0_2
    watchlist_result: add_result
    expected:
      route: watchlist_workflow
      state:
        watchlist_result.action: add
        watchlist_result.dmf_no: DMF-001
      answer:
        contains:
        - DMF-001
        - 团队共享关注清单
        - watch-1
      call_deltas:
        llm: 3
        dmf: 0
        document_extract: 0
        export: 0
        watchlist: 1
  - user_query: 查看团队关注清单
    scripted_llm:
    - react_1_0
    - react_1_1
    - react_1_2
    watchlist_result: list_result
    expected:
      route: watchlist_workflow
      answer:
        contains:
        - DMF-001
        - watch-1
        markdown_headers:
        - 关注项 ID
      call_deltas:
        llm: 3
        dmf: 0
        document_extract: 0
        export: 0
        watchlist: 1
      state: {}
  - user_query: 立即检查关注项 watch-1
    scripted_llm:
    - react_2_0
    - react_2_1
    - react_2_2
    watchlist_result: run_result
    expected:
      route: watchlist_workflow
      answer:
        contains:
        - DMF-001
        - no_change
      call_deltas:
        llm: 3
        dmf: 0
        document_extract: 0
        export: 0
        watchlist: 1
      state: {}
  - user_query: 查看关注项 watch-1 的事件
    scripted_llm:
    - react_3_0
    - react_3_1
    - react_3_2
    watchlist_result: events_result
    expected:
      route: watchlist_workflow
      answer:
        contains:
        - event-1
        - valid_date_expired
        - unread
        not_contains:
        - raw_payload
        - captcha
        - Authorization
      call_deltas:
        llm: 3
        dmf: 0
        document_extract: 0
        export: 0
        watchlist: 1
      state: {}
  - user_query: 确认关注项 watch-1 的事件 event-1
    scripted_llm:
    - react_4_0
    - react_4_1
    - react_4_2
    watchlist_result: ack_result
    expected:
      route: watchlist_workflow
      answer:
        contains:
        - event-1
        - acknowledged
      call_deltas:
        llm: 3
        dmf: 0
        document_extract: 0
        export: 0
        watchlist: 1
      state: {}
  - user_query: 删除关注项 watch-1
    scripted_llm:
    - react_5_0
    - react_5_1
    - react_5_2
    watchlist_result: remove_result
    expected:
      route: watchlist_workflow
      answer:
        contains:
        - DMF-001
        - 团队共享关注清单
        - 删除
      call_deltas:
        llm: 3
        dmf: 0
        document_extract: 0
        export: 0
        watchlist: 1
      state: {}
  expected_calls:
    llm: 18
    dmf: 0
    document_extract: 0
    export: 0
    watchlist: 6
