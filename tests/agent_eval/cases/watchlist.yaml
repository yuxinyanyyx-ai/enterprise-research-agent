- id: WATCH-005
  description: Unexpected Watchlist failure is sanitized by the real Agent node
  tags:
  - watchlist
  - failure
  - security
  fixtures:
    failure:
      kind: error
      value: database password=top-secret at C:\private\watchlist.db
      sensitive: true
    react_0_0:
      kind: llm
      value:
        tool_calls:
        - name: run_watchlist_workflow
          args: {}
          id: WATCH-005-0-0
          type: tool_call
    react_0_1:
      kind: llm
      value:
        watchlist_action: list
  turns:
  - user_query: 查看团队关注清单
    scripted_llm:
    - react_0_0
    - react_0_1
    watchlist_result: failure
    expected:
      route: watchlist_workflow
      answer:
        contains:
        - 暂时失败
        - 稍后重试
        not_contains:
        - top-secret
        - password
        - private
        - watchlist.db
      call_deltas:
        llm: 2
        dmf: 0
        document_extract: 0
        export: 0
        watchlist: 1
      state: {}
