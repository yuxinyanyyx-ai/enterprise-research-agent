        - dmf_no: DMF-002
        - dmf_no: dmf-002
  fixtures:
    result:
      kind: watchlist_result
      value:
        id: watch-2
        dmf_no: DMF-002
        status: active
        interval_hours: 24
        next_run_at: null
    react_0_0:
      kind: llm
      value:
        tool_calls:
        - name: run_watchlist_workflow
          args: {}
          id: WATCH-002-0-0
          type: tool_call
    react_0_1:
      kind: llm
      value:
        watchlist_action: add
    react_0_2:
      kind: llm
      value:
        answer_from: tool
  turns:
