<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMF Research Agent</title>
    <link rel="stylesheet" href="/static/style.css?v=20260825-1">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar" id="sidebar">
            <button class="sidebar-close" id="sidebarCloseButton" type="button" aria-label="关闭导航">×</button>
            <header class="brand-block">
                <div class="brand-mark" aria-hidden="true">D</div>
                <div><h1>DMF Research</h1><p>Regulatory intelligence</p></div>
            </header>
            <section class="sidebar-section">
                <div class="section-label">当前文档</div>
                <div class="document-state" id="documentState">
                    <span class="document-icon" aria-hidden="true">▱</span>
                    <div class="document-copy"><strong id="documentName">未选择文档</strong><span id="documentMeta">等待上传</span></div>
                    <button class="icon-button hidden" id="clearDocumentButton" type="button" title="清除文档" aria-label="清除文档">×</button>
                </div>
                <input id="fileInput" type="file" hidden accept=".pdf,.doc,.docx,.ppt,.pptx,.png,.jpg,.jpeg,.xlsx,.xls,.md,.txt">
                <button class="upload-button" id="uploadButton" type="button"><span aria-hidden="true">＋</span>上传文档</button>
            </section>
            <section class="sidebar-section session-section">
                <div class="section-label">会话</div>
                <div class="session-row"><span class="status-dot" id="statusDot"></span><span id="sessionStatus">正在建立连接</span></div>
            </section>
            <footer class="sidebar-footer"><span>DMF Agent</span><span class="environment-badge">LOCAL</span></footer>
        </aside>
        <main class="workspace">
            <header class="workspace-header">
                <button class="menu-button" id="menuButton" type="button" aria-label="打开导航">☰</button>
                <div><h2>研究工作台</h2><p id="activityText">可开始新的 DMF 查询</p></div>
                <div class="header-status"><span class="pulse-dot"></span>Agent online</div>
            </header>
            <section class="conversation" id="conversation" aria-live="polite">
                <div class="welcome" id="welcome">
                    <div class="welcome-kicker">DMF RESEARCH AGENT</div>
                    <h2>DMF查询</h2>
                    <div class="suggestion-row">
                        <button class="suggestion" type="button" data-prompt="查询 Ibuprofen 的 DMF 记录">查询成分记录</button>
                        <button class="suggestion" type="button" data-prompt="分析当前上传的文档并查询 DMF">分析上传文档</button>
                        <button class="suggestion" type="button" data-prompt="将刚才的 DMF 查询结果导出为 Excel">导出查询结果</button>
                    </div>
                </div>
            </section>
            <section class="composer-wrap">
                <div class="upload-progress hidden" id="uploadProgress"><span class="spinner"></span><span id="uploadProgressText">正在处理文档</span></div>
                <form class="composer" id="messageForm">
                    <button class="attach-button" id="attachButton" type="button" title="上传文档" aria-label="上传文档">＋</button>
                    <textarea id="messageInput" rows="1" maxlength="10000" placeholder="输入 DMF 查询或文档分析请求"></textarea>
                    <button class="send-button" id="sendButton" type="submit" title="发送" aria-label="发送"><span aria-hidden="true">↑</span></button>
                </form>
                <div class="composer-meta"><span id="composerHint">结果来自实时 DMF 数据与已上传文档</span><span id="charCount">0 / 10000</span></div>
            </section>
        </main>
    </div>
    <div class="drop-overlay" id="dropOverlay" aria-hidden="true">
        <div class="drop-target">
            <span class="drop-icon" aria-hidden="true">＋</span>
            <strong>释放以上传文档</strong>
        </div>
    </div>
    <div class="toast-region" id="toastRegion" aria-live="assertive"></div>
    <script src="/static/app.js?v=20260825-2"></script>
</body>
</html>
